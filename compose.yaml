services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/floci:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_HOSTNAME: floci
      # Run the dashboard below as a managed Compose service instead.
      FLOCI_SERVICES_UI_ENABLED: "false"

  floci-ui:
    image: floci/floci-ui:latest
    depends_on:
      - floci
    ports:
      - "4500:4500"
    environment:
      # Docker Compose service DNS; do not use localhost here.
      FLOCI_ENDPOINT: http://floci:4566
      # Must match the region used by aws-init to create userStats.
      AWS_REGION: ap-southeast-1
      AWS_DEFAULT_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local

  aws-init:
    image: amazon/aws-cli:latest
    depends_on:
      - floci
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-southeast-1
      AWS_ENDPOINT_URL: http://floci:4566
    entrypoint: ["/bin/sh", "/scripts/init-dynamodb.sh"]
    volumes:
      - ./scripts/init-dynamodb.sh:/scripts/init-dynamodb.sh:ro
      - ./data:/input:ro

  backend:
    build:
      context: ./backend
    depends_on:
      aws-init:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      FRONTEND_ORIGIN: http://localhost:3000
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_TABLE: userStats
      AWS_ENDPOINT_URL: http://floci:4566
      PROCESSING_API_TOKEN: local-development-token
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"

  spark-job:
    build:
      context: .
      dockerfile: backend/jobs/Dockerfile.local
    profiles: ["processing"]
    depends_on:
      aws-init:
        condition: service_completed_successfully
    environment:
      AWS_REGION: ap-southeast-1
      AWS_DEFAULT_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_ENDPOINT_URL: http://floci:4566
    volumes:
      - ./data:/workspace/data:ro
